name: Build & Release EXE

# 只有打符合 v* 的 tag 才執行
on:
  push:
    tags:
      - 'v*'

permissions:           # 讓 GITHUB_TOKEN 能夠發 Release、上傳
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 取程式碼
    - uses: actions/checkout@v4

    # 2. 安裝 ps2exe
    - name: Install ps2exe
      shell: powershell
      run: Install-Module ps2exe -Scope CurrentUser -Force -Confirm:$false

    # 3. 編譯 EXE
    - name: Compile Toggle-ICS.exe
      shell: powershell
      run: |
        Invoke-PS2EXE -InputFile Toggle-ICS.ps1 `
                      -OutputFile Toggle-ICS.exe `
                      -NoConsole -RequireAdmin

    # 4. 建立 / 更新 Release 並附檔
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: Toggle-ICS.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
